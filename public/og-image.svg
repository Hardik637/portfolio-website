<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Obsidian Base Background -->
  <rect width="1200" height="630" fill="#101110"/>

  <!-- Precision Architectural Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#242624" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Framing Border -->
  <rect x="32" y="32" width="1136" height="566" rx="20" stroke="#343734" stroke-width="2"/>

  <!-- Brand Mark Monogram -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="14" fill="#181A18" stroke="#343734" stroke-width="2"/>
    <text x="32" y="42" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="28" fill="#C6F36A" text-anchor="middle">HA</text>
  </g>

  <!-- Status Chip -->
  <g transform="translate(164, 96)">
    <rect width="240" height="32" rx="16" fill="#181A18" stroke="#343734" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#C6F36A"/>
    <text x="34" y="21" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#F4F3EE">AVAILABLE FOR PROJECTS</text>
  </g>

  <!-- Main Headline Typography -->
  <text x="80" y="240" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="52" fill="#F4F3EE" letter-spacing="-1">
    Building digital experiences that
  </text>
  <text x="80" y="306" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="52" fill="#F4F3EE" letter-spacing="-1">
    move businesses <tspan fill="#C6F36A" font-style="italic" font-family="'Playfair Display', serif">forward.</tspan>
  </text>

  <!-- Subtitle Narrative -->
  <text x="80" y="380" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#A3A7A1">
    Web Developer &amp; Digital Experience Builder
  </text>
  <text x="80" y="415" font-family="'Inter', sans-serif" font-size="18" font-weight="400" fill="#707570">
    BCA Candidate at Manipal University Jaipur • React • Modern Web Architecture
  </text>

  <!-- Bottom Details Bar -->
  <line x1="80" y1="480" x2="1120" y2="480" stroke="#343734" stroke-width="1"/>
  
  <text x="80" y="525" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#F4F3EE">
    hardikagarwal@gmail.com
  </text>

  <text x="1120" y="525" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#C6F36A" text-anchor="end">
    github.com/Hardik637
  </text>
</svg>
