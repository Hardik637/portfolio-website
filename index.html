<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hardik Agarwal — Web Developer & Digital Experience Builder</title>
    <meta name="description" content="Personal portfolio of Hardik Agarwal — Web Developer & Digital Experience Builder. Designing and building modern digital experiences with clarity, precision, and purpose." />
    
    <!-- OpenGraph / Social Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hardik Agarwal — Web Developer & Digital Experience Builder" />
    <meta property="og:description" content="I design and develop modern websites, e-commerce experiences and custom web solutions that combine thoughtful design with reliable functionality." />
    <meta property="og:site_name" content="Hardik Agarwal Portfolio" />

    <!-- Google Fonts Preconnect & Subsets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- Instant Anti-FOUC Theme Initialization Script -->
    <script>
      (function() {
        try {
          const storedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = storedTheme ? storedTheme : (prefersDark ? 'dark' : 'dark'); // Default to dark theme as primary
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg-primary text-text-primary antialiased selection:bg-accent selection:text-obsidian transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
